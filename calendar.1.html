<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Wall Component</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wall-container">
       <div class="add-form" id="addForm">
      <div class="form-content">
        <h3 class="form-title">Add New Note</h3>
        <div class="form-group">
          <label>Title</label>
          <input
            type="text"
            class="form-input"
            id="noteTitle"
            placeholder="Enter note title"
          />
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea
            class="form-textarea"
            id="noteContent"
            placeholder="Enter note content"
          ></textarea>
        </div>
        <div class="form-group">
          <label>Color</label>
          <select class="form-select" id="noteColor">
            <option value="note-yellow">Yellow</option>
            <option value="note-blue">Blue</option>
            <option value="note-pink">Pink</option>
            <option value="note-orange">Orange</option>
            <option value="note-green">Green</option>
            <option value="note-purple">Purple</option>
          </select>
        </div>
        <div class="form-buttons">
          <button class="btn-cancel" onclick="closeForm()">Cancel</button>
          <button class="btn-save" onclick="saveNote()">Save Note</button>
        </div>
      </div>
    </div>
      <div class="content-header">
        <h1 class="page-title">Sticky Wall</h1>
        <input
          type="text"
          class="search-box"
          placeholder="Search notes..."
          id="searchBox"
          oninput="filterNotes()"
        />
      </div>

      <div class="sticky-wall" id="stickyWall"></div>
    </div>
  </body>
</html>
